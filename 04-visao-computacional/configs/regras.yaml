# Regras de negócio que transformam detecções em decisão. Ajuste aqui, não no código.
deteccao:
  confianca_minima: 0.35      # abaixo disso a detecção é ignorada
  iou: 0.5
  tamanho_imagem: 640
  area_maxima: 0.5           # caixa cobrindo mais que isso da foto não é luminária: descartada

luminosidade:               # brilho médio da cena, de 0 (preto) a 255 (branco)
  limiar_escuro: 55           # abaixo: cena escura
  limiar_dia: 120             # acima: provavelmente foto de dia (não serve de evidência)
  limiar_breu: 25             # abaixo: breu, quase nenhuma luz; o poste pode nem aparecer na foto

validacao:                  # foto enviada pelo cidadão
  lado_minimo_px: 320         # imagem menor que isso não serve
  nitidez_minima: 5.0         # ver imagem.nitidez(): fotos boas >= 8, borradas <= 2.6

prioridade:                 # pontuação de 0 a 100, sempre com os fatores explicados
  pontos_por_poste_apagado: 25
  max_pontos_postes: 50
  pontos_trecho_escuro: 30
  pontos_trecho_parcial: 15
  pontos_sensor_lux_baixo: 20
  pontos_cena_muito_escura: 15  # análise de cena: região muito escura ou breu
  pontos_apagao: 20             # análise de cena: nenhuma fonte de luz (possível falta de energia)
  limiar_sensor_lux: 5.0      # lux medido pelo robô; rua bem iluminada fica acima de ~10 lux
  faixas:                     # pontuação mínima de cada nível
    alta: 60
    media: 30

sensores:                   # robô do Maker Lab (LDR + ultrassônico + GPS)
  # Se o robô não mandar a lista `alerta`, a API deduz pelos valores:
  #   sensor_lux < prioridade.limiar_sensor_lux       -> "escuro"
  #   sensor_distancia_cm >= distancia_buraco_cm      -> "buraco"
  distancia_buraco_cm: 15.0   # ultrassônico apontado para o chão: acima disso = desnível. AJUSTAR com o Heitor

fusao:                      # pontos extras quando sensor e foto são cruzados
  pontos_buraco: 30           # buraco visto na foto
  pontos_buraco_no_escuro: 25 # buraco + trecho escuro: risco de queda (ODS 3)
  pontos_confirmado: 15       # o sensor do robô e a foto concordam

alerta_robo:                # alerta só com sensores (sem foto): prioridade prévia
  pontos_escuro: 30
  pontos_buraco: 30
  pontos_escuro_e_buraco: 25

orientacao:                 # perguntas feitas ao GenAI (01) para cada tipo de chamado confirmado
  perguntas:                # {cidade} = GENAI_CIDADE (padrão São Paulo)
    conserto_poste: "Qual o prazo para consertar a iluminação pública em {cidade}?"
    instalacao_iluminacao: "Como pedir a instalação de iluminação pública em uma rua sem poste em {cidade}?"
    poda_ou_obstrucao: "O que pode atrasar o reparo da iluminação pública em {cidade}?"
    buraco: "Qual o prazo para tapar um buraco na rua em {cidade}?"
    trecho_sem_luz: "Qual o prazo para consertar a iluminação pública em {cidade}?"
    falta_de_energia: "O que fazer quando falta energia elétrica na rua em {cidade}?"

cena:                       # análise da foto inteira (visao/cena.py): a região está no escuro?
  limiar_iluminado: 90        # pixel com brilho acima disso conta como "área iluminada"
  limiar_fonte: 225           # pixel quase saturado = parte de uma fonte de luz
  area_minima_fonte: 0.0002   # fração mínima da imagem para contar como fonte (ignora ruído/estrelas)
  chao_referencia: 110        # brilho do chão de uma rua bem iluminada à noite
  area_referencia: 0.35       # fração iluminada de uma rua bem iluminada
  media_referencia: 110
  indice_muito_escura: 78     # índice de escuridão (0-100) a partir do qual a região é "muito escura"
  indice_pouca_iluminacao: 55
  fontes_max_apagao: 0        # possível apagão: escuro E nenhuma fonte de luz na cena...
  area_fontes_max_apagao: 0.0005  # ...nem mesmo pequenas (janelas, letreiros, faróis)
